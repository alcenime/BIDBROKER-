name: Unzip miners
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          mkdir -p tmp assets/miners assets/metadata
          for z in miners_part*.zip; do unzip -oq "$z" -d tmp; done
          mv tmp/miners_full/*.png assets/miners/
          mv tmp/miners_full/metadata/*.json assets/metadata/
          [ -f tmp/miners_full/rarity.json ] && mv tmp/miners_full/rarity.json assets/
          rm -rf tmp miners_part*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract miner images"
          git push
